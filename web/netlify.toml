[build.environment]
# URL e chiave pubblicabile Supabase sono inclusi intenzionalmente nel browser.
# Anche l'indirizzo mittente Resend è pubblico nell'informativa privacy.
# Continua a controllare RESEND_API_KEY e SUPABASE_SECRET_KEY.
SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,RESEND_FROM_EMAIL"

[[plugins]]
package = "@netlify/plugin-nextjs"
